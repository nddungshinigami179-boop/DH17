<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DH17 SHOP</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="shop.css" />
  </head>
  <body>
    <header>
      <nav class="nav-container">
        <a href="http://127.0.0.1:5500/DH17/index.html" class="nav-logo">
          <img src="reallogo.png" alt="DH17 Logo" class="logo-img">
        </a>
        <div class="nav-menu">
          <ul class="nav-list">
            <li class="nav-item">
              <a href="http://127.0.0.1:5500/DH17/index.html" class="nav-links">Trang Chủ</a>
            </li>
            <li class="nav-item">
              <a href="http://127.0.0.1:5500/DH17/shop5.html" class="nav-links">Sản phẩm mới</a>
            </li>
            <li class="nav-item">
              <a href="http://127.0.0.1:5500/DH17/shop2.html" class="nav-links">Áo</a>
            </li>
            <li class="nav-item">
              <a href="http://127.0.0.1:5500/DH17/shop3.html" class="nav-links">Quần</a>
            </li>
            <li class="nav-item">
              <a href="http://127.0.0.1:5500/DH17/shop4.html" class="nav-links">Phụ Kiện</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-links">Hệ thống cửa hàng</a>
            </li>
          </ul>
        </div>
        <div>
            <img class="cart" src="cart.png" alt="">
        </div>
      </nav>
    </header>

    <section class="product">
        <div class="product-container">
            <div class="product-img">
              <img class="shorts-png" src="quần đùi túi hộp.jpg" alt="quần đùi túi hộp">             
            </div>

            <div class="product-detail">
              <h2 class="product-title">Quần đùi túi hộp</h2>         
              <p class="price">550.000đ</p>

              <div class="product-options">
               <p><strong>Kích cỡ:</strong></p>
                <div class="size">
                  <a href="#" class="size-option">S</a>
                  <a href="#" class="size-option">M</a>
                  <a href="#" class="size-option">L</a>
                  <a href="#" class="size-option">XL</a>
                </div>
              </div>

              <div class="buttons">
                <div class="sl">
                  <input type="number" value="1" min="1" class="quantity-input">
                </div>
                    <a href="#" class="buy">MUA NGAY</a>
                    <a href="#" class="add">THÊM VÀO GIỎ</a>
              </div>

              <div class="product-description">
                <h3>Mô tả</h3>
                <ul>
                    <li>100% Nylon</li>
                    <li>Oversize</li>
                    <li>Unisex</li>
                </ul>
              </div>
            </div>
        </div>
    </section>

    <footer>
      <div>
        <p>
          Liên hệ với sốpp: <a href="https://www.facebook.com/nguyen.duc.dung.929723?locale=vi_VN" class="lh">Nguyễn Đức Dũng</a>
        </p>
      </div>
      <p>© 2025 Nguyễn Đức Dũng | All rights reserved.</p>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcMDD+rQgpGFF9h"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
